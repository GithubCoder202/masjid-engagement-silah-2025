<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silah — AI-Powered Community Platform</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Supabase JS client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <!-- Leaflet (mosque map view) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <style>
        /* ========== DESIGN SYSTEM ========== */
        :root {
            --green: #1A6B4F;
            --green-light: #238B68;
            --green-dark: #0F4A37;
            --green-pale: #E8F5F0;
            --gold: #C9A84C;
            --gold-light: #E8D48A;
            --gold-pale: #FDF6E0;
            --cream: #FDF8F0;
            --teal: #2A9D8F;
            --teal-light: #6BC4B8;
            --charcoal: #2C3E50;
            --charcoal-light: #4A627A;
            --gray-50: #F8FAFB;
            --gray-100: #EEF2F5;
            --gray-200: #DCE3E9;
            --gray-300: #B8C4CE;
            --gray-400: #8FA0AE;
            --gray-500: #6B7F8F;
            --white: #ffffff;
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --text-primary: #2C3E50;
            --text-secondary: #6B7F8F;
            --border-light: #EEF2F5;
            --border-medium: #DCE3E9;
            --shadow-sm: 0 2px 8px rgba(26, 107, 79, 0.08);
            --shadow-md: 0 8px 24px rgba(26, 107, 79, 0.12);
            --shadow-lg: 0 16px 48px rgba(26, 107, 79, 0.16);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-full: 9999px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-theme: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --red: #e74c3c;
            --red-light: #fde8e8;
            --orange: #f39c12;
            --orange-light: #fef5e7;
            --blue: #3498db;
            --blue-light: #eaf4fb;
            --purple: #8e44ad;
            --purple-light: #f4ecf7;
        }

        /* ========== DARK MODE VARIABLES ========== */
        [data-theme="dark"] {
            --green: #2ea87a;
            --green-light: #3cc08e;
            --green-dark: #1a5c40;
            --green-pale: #1a2f26;
            --gold: #d4b55c;
            --gold-light: #c9a84c;
            --gold-pale: #2a2418;
            --cream: #181a1d;
            --teal: #3ab8a8;
            --teal-light: #5ccfc0;
            --charcoal: #d0d5dc;
            --charcoal-light: #a0a8b4;
            --gray-50: #1f2126;
            --gray-100: #282b30;
            --gray-200: #33363c;
            --gray-300: #4a4e55;
            --gray-400: #7a7f88;
            --gray-500: #9a9fa8;
            --white: #1f2126;
            --card-bg: #23252b;
            --input-bg: #2a2d34;
            --text-primary: #e0e3e8;
            --text-secondary: #9a9fa8;
            --border-light: #2a2d34;
            --border-medium: #3a3d44;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
            --blue: #5b9bd5;
            --blue-light: #1a2a38;
            --purple: #a569bd;
            --purple-light: #2a1a38;
        }

        /* ========== RESET & BASE ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--charcoal);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background var(--transition-theme), color var(--transition-theme);
        }

        /* ========== APP SHELL ========== */
        .app {
            width: 100%;
            height: 100%;
            background: var(--cream);
            display: flex;
            overflow: hidden;
            position: relative;
            transition: background var(--transition-theme);
        }

        body:not(.authenticated) .app {
            display: none;
        }
        body.authenticated .auth-screen {
            display: none;
        }

        /* ========== AUTH SCREEN ========== */
        .auth-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: linear-gradient(160deg, var(--green-dark) 0%, var(--green) 45%, var(--teal) 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            overflow-y: auto;
        }

        .auth-card {
            width: 100%;
            max-width: 520px;
            background: var(--cream);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 36px 36px 28px;
            margin: auto;
            transition: background var(--transition-theme);
            position: relative;
        }

        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }
        .auth-brand .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--green-dark);
            font-weight: 800;
            flex-shrink: 0;
            transition: background var(--transition-theme), transform 0.3s ease;
        }
        .auth-brand .logo-icon:hover {
            transform: scale(1.05);
        }
        [data-theme="dark"] .auth-brand .logo-icon {
            background: #d4b55c;
            color: #0d1f17;
        }
        .auth-brand h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            transition: color var(--transition-theme);
        }
        .auth-brand h1 span {
            color: var(--gold);
        }

        .auth-tabs {
            display: flex;
            background: var(--gray-100);
            border-radius: var(--radius-full);
            padding: 4px;
            margin-bottom: 24px;
            transition: background var(--transition-theme);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: var(--radius-full);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: var(--gray-500);
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-tab.active {
            background: var(--green);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .auth-step {
            display: none;
        }
        .auth-step.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: 'Inter', sans-serif;
        }
        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus,
        .form-group textarea:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(26, 107, 79, 0.08);
        }

        .auth-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: var(--text-secondary);
            transition: color var(--transition-theme);
        }
        .auth-switch a {
            color: var(--green);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-error {
            background: #FDEDEC;
            color: #C0392B;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        .auth-error.show {
            display: block;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: #C0392B;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .btn-logout:hover {
            border-color: #C0392B;
            background: #FDEDEC;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--green) 0%, var(--green-light) 100%);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(26, 107, 79, 0.25);
            letter-spacing: 0.3px;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            border-radius: inherit;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 30px rgba(26, 107, 79, 0.35);
        }
        .btn-primary:hover::before {
            opacity: 1;
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 2px 10px rgba(26, 107, 79, 0.2);
        }
        .btn-primary span,
        .btn-primary i {
            position: relative;
            z-index: 1;
        }
        .btn-primary i {
            transition: transform 0.3s ease;
        }
        .btn-primary:hover i {
            transform: translateX(4px);
        }
        .btn-primary .btn-shimmer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            animation: shimmer 3s infinite;
            z-index: 0;
        }
        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 200%;
            }
        }

        .btn-secondary {
            padding: 10px 24px;
            background: var(--gray-100);
            color: var(--text-primary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-secondary:hover {
            background: var(--gray-200);
            border-color: var(--gray-300);
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--green);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            color: #fff;
            flex-shrink: 0;
            height: 100%;
            overflow-y: auto;
            transition: background var(--transition-theme);
        }

        [data-theme="dark"] .sidebar {
            background: #0d1f17;
            border-right: 1px solid #1a3025;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
            cursor: pointer;
        }

        .sidebar-brand .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--green-dark);
            font-weight: 800;
            transition: background var(--transition-theme), transform 0.3s ease;
        }
        .sidebar-brand .logo-icon:hover {
            transform: scale(1.05);
        }

        [data-theme="dark"] .sidebar-brand .logo-icon {
            background: #d4b55c;
            color: #0d1f17;
        }

        .sidebar-brand h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .sidebar-brand h1 span {
            color: var(--gold-light);
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .sidebar-nav .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .sidebar-nav .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            box-shadow: inset 3px 0 0 var(--gold);
        }

        .sidebar-nav .nav-item i {
            width: 20px;
            font-size: 16px;
            text-align: center;
        }

        .sidebar-stats {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .sidebar-stats .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        .sidebar-stats .stat-row span:last-child {
            color: #fff;
            font-weight: 600;
        }

        .sidebar-hadith {
            margin-top: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.7;
            border-left: 3px solid var(--gold);
            flex-shrink: 0;
        }
        .sidebar-hadith .source {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* ========== MAIN CONTENT ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--cream);
            min-width: 0;
            transition: background var(--transition-theme);
        }

        /* ========== TOP BAR ========== */
        .topbar {
            padding: 18px 32px;
            background: var(--white);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px;
            transition: background var(--transition-theme), border-color var(--transition-theme);
            position: relative;
            z-index: 50;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .topbar-left .greeting {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition-theme);
        }
        .topbar-left .greeting small {
            font-weight: 400;
            color: var(--text-secondary);
            font-size: 14px;
            transition: color var(--transition-theme);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            position: relative;
        }

        /* ===== SEARCH BAR ===== */
        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            color: var(--gray-400);
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
        }
        .search-wrapper input {
            padding: 8px 16px 8px 40px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            transition: var(--transition);
            width: 200px;
            outline: none;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }
        .search-wrapper input:focus {
            border-color: var(--green);
            background: var(--input-bg);
            box-shadow: 0 0 0 4px rgba(26, 107, 79, 0.1);
            width: 260px;
        }
        .search-wrapper input::placeholder {
            color: var(--gray-400);
        }

        /* Search Popup */
        .search-popup {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            left: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            max-height: 420px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            animation: fadeUp 0.25s ease;
            transition: background var(--transition-theme), border-color var(--transition-theme);
            min-width: 320px;
        }
        .search-popup.show {
            display: block;
        }
        .search-popup::-webkit-scrollbar {
            width: 4px;
        }
        .search-popup::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        .search-popup .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.15s ease;
            text-decoration: none;
            color: var(--text-primary);
        }
        .search-popup .search-result-item:last-child {
            border-bottom: none;
        }
        .search-popup .search-result-item:hover {
            background: var(--gray-50);
        }
        [data-theme="dark"] .search-popup .search-result-item:hover {
            background: var(--gray-100);
        }
        .search-popup .search-result-item .result-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green-pale);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .search-popup .search-result-item .result-info {
            flex: 1;
            min-width: 0;
        }
        .search-popup .search-result-item .result-info .result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .search-popup .search-result-item .result-info .result-desc {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .search-popup .search-result-item .result-badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: var(--radius-full);
            background: var(--gray-100);
            color: var(--text-secondary);
            font-weight: 600;
            flex-shrink: 0;
        }
        [data-theme="dark"] .search-popup .search-result-item .result-badge {
            background: var(--gray-200);
        }
        .search-popup .search-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .search-popup .search-empty i {
            font-size: 28px;
            color: var(--gray-300);
            display: block;
            margin-bottom: 8px;
        }
        .search-popup .search-section-header {
            padding: 8px 16px 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-400);
            border-bottom: 1px solid var(--border-light);
        }

        .topbar-right .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--gray-500);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .topbar-right .icon-btn:hover {
            background: var(--gray-100);
            color: var(--charcoal);
        }
        .topbar-right .icon-btn .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: var(--gold);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar-wrapper {
            position: relative;
            cursor: pointer;
        }
        .topbar-right .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--green-pale);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            border: 2px solid var(--border-medium);
            transition: var(--transition);
        }
        .topbar-right .avatar:hover {
            border-color: var(--green);
        }

        .profile-popup {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 18px 22px;
            min-width: 220px;
            z-index: 100;
            display: none;
            animation: fadeUp 0.25s ease;
            transition: background var(--transition-theme), border-color var(--transition-theme);
        }

            display: block;
        }
        .profile-popup .pp-name {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }
        .profile-popup .pp-email {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 2px 0 4px;
        }
        .profile-popup .pp-location {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .profile-popup .pp-divider {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 8px 0 10px;
        }
        .profile-popup .pp-logout {
            width: 100%;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: #e74c3c;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-popup .pp-logout:hover {
            color: #c0392b;
        }
        .profile-popup .pp-edit {
            width: 100%;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-popup .pp-edit:hover {
            color: var(--green);
        }

        .notification-popup {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            width: 340px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            animation: slideDownNotif 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: background var(--transition-theme), border-color var(--transition-theme);
        }
        .notification-popup.show {
            display: block;
        }
        @keyframes slideDownNotif {
            from {
                opacity: 0;
                transform: translateY(-10px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .notification-popup .notif-header {
            padding: 14px 18px 10px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notification-popup .notif-header h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .notification-popup .notif-header .notif-mark-all {
            font-size: 12px;
            color: var(--green);
            cursor: pointer;
            font-weight: 600;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
        }
        .notification-popup .notif-header .notif-mark-all:hover {
            text-decoration: underline;
        }
        .notification-popup .notif-item {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            gap: 12px;
            align-items: flex-start;
            transition: background 0.2s ease;
            cursor: pointer;
        }
        .notification-popup .notif-item:hover {
            background: var(--gray-50);
        }
        [data-theme="dark"] .notification-popup .notif-item:hover {
            background: var(--gray-100);
        }
        .notification-popup .notif-item .notif-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green-pale);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .notification-popup .notif-item .notif-body {
            flex: 1;
        }
        .notification-popup .notif-item .notif-body .notif-text {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .notification-popup .notif-item .notif-body .notif-text strong {
            color: var(--green);
        }
        .notification-popup .notif-item .notif-body .notif-time {
            font-size: 11px;
            color: var(--gray-400);
            margin-top: 2px;
        }
        .notification-popup .notif-item.unread {
            border-left: 3px solid var(--green);
        }
        .notification-popup .notif-empty {
            padding: 30px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .notification-popup .notif-empty i {
            font-size: 28px;
            color: var(--gray-300);
            display: block;
            margin-bottom: 8px;
        }
        .notification-popup::-webkit-scrollbar {
            width: 4px;
        }
        .notification-popup::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        .about-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInOverlay 0.3s ease;
        }
        .about-overlay.show {
            display: flex;
        }
        @keyframes fadeInOverlay {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .about-modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 480px;
            width: 100%;
            padding: 32px 36px 28px;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: background var(--transition-theme);
            position: relative;
        }
        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .about-modal .about-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--gray-400);
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .about-modal .about-close:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }
        .about-modal .about-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .about-modal .about-brand .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--green-dark);
            font-weight: 800;
            flex-shrink: 0;
        }
        [data-theme="dark"] .about-modal .about-brand .logo-icon {
            background: #d4b55c;
            color: #0d1f17;
        }
        .about-modal .about-brand h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
        }
        .about-modal .about-brand h2 span {
            color: var(--gold);
        }
        .about-modal .about-desc {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 18px;
        }
        .about-modal .about-divider {
            border: none;
            border-top: 2px solid var(--border-light);
            margin: 14px 0 16px;
        }
        .about-modal .about-credit {
            text-align: center;
            padding: 6px 0 2px;
        }
        .about-modal .about-credit .credit-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .about-modal .about-credit .credit-label span {
            color: var(--gold);
        }
        .about-modal .about-version {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            color: var(--gray-400);
        }

        /* ========== SCREEN CONTAINER ========== */
        .screen-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px 32px;
            position: relative;
            min-height: 0;
            transition: background var(--transition-theme);
        }

        [data-theme="dark"] .screen-container {
            background: #181a1d;
        }

        .screen-container::-webkit-scrollbar {
            width: 6px;
        }
        .screen-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .screen-container::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        .screen {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== ONBOARDING STEP STYLES ========== */
        #onboardingStep {
            padding-top: 8px;
        }
        #onboardingStep .radio-grid,
        #onboardingStep .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }
        #onboardingStep .radio-option,
        #onboardingStep .checkbox-option {
            flex: 1 1 calc(50% - 10px);
            min-width: 140px;
            background: var(--gray-50);
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        [data-theme="dark"] #onboardingStep .radio-option,
        [data-theme="dark"] #onboardingStep .checkbox-option {
            background: var(--gray-100);
            border-color: var(--border-light);
        }
        #onboardingStep .radio-option:hover,
        #onboardingStep .checkbox-option:hover {
            border-color: var(--green);
            background: var(--green-pale);
        }
        #onboardingStep .radio-option.selected,
        #onboardingStep .checkbox-option.selected {
            border-color: var(--green);
            background: var(--green-pale);
            box-shadow: 0 0 0 2px rgba(26, 107, 79, 0.15);
        }
        [data-theme="dark"] #onboardingStep .radio-option.selected,
        [data-theme="dark"] #onboardingStep .checkbox-option.selected {
            background: #1a2f26;
            border-color: #2ea87a;
        }
        #onboardingStep .radio-option i,
        #onboardingStep .checkbox-option i {
            color: var(--gray-400);
            transition: color var(--transition);
            font-size: 16px;
        }
        #onboardingStep .radio-option.selected i,
        #onboardingStep .checkbox-option.selected i {
            color: var(--green);
        }
        #onboardingStep .checkbox-option {
            flex: 1 1 calc(33.333% - 10px);
            min-width: 120px;
        }
        #onboardingStep .onboarding-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        #onboardingStep .onboarding-footer i {
            color: var(--green);
        }
        @media (max-width: 600px) {
            #onboardingStep .radio-option,
            #onboardingStep .checkbox-option {
                flex: 1 1 100%;
                min-width: unset;
            }
            #onboardingStep .checkbox-option {
                flex: 1 1 100%;
            }
        }

        /* ========== QURAN VERSE WIDGET ========== */
        .quran-verse-widget {
            background: linear-gradient(135deg, #fdf6e0 0%, #fef9ee 30%, #faf3e0 60%, #fdf6e0 100%);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(201, 168, 76, 0.25);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-theme);
        }

        [data-theme="dark"] .quran-verse-widget {
            background: linear-gradient(135deg, #1f2418 0%, #23281c 30%, #1e2216 60%, #1f2418 100%);
            border-color: rgba(212, 181, 92, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .quran-verse-widget::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 168, 76, 0.12) 0%, transparent 70%);
            pointer-events: none;
        }

        .quran-verse-widget::after {
            content: '☾';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 32px;
            opacity: 0.15;
            pointer-events: none;
            color: var(--gold);
        }

        [data-theme="dark"] .quran-verse-widget::after {
            opacity: 0.2;
            color: #d4b55c;
        }

        .quran-verse-widget .qv-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center;    /* Center everything horizontally */
            justify-content: center;
            gap: 14px;
        }

        .quran-verse-widget .qv-icon-col {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--gold-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid var(--gold-light);
            transition: all var(--transition-theme);
        }

        [data-theme="dark"] .quran-verse-widget .qv-icon-col {
            background: #2a2418;
            border-color: #5a4820;
        }

        .quran-verse-widget .qv-content {
            flex: 1;
            width: 100%;
            max-width: 650px; /* Constrains the width so text wraps beautifully */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quran-verse-widget .qv-arabic {
            font-family: 'Amiri', 'Traditional Arabic', serif;
            font-size: 28px; /* Slightly larger for emphasis */
            line-height: 1.8;
            color: #3d2e0a;
            margin-bottom: 8px;
            direction: rtl;
            text-align: center; /* Force center alignment */
            font-weight: 700;
            letter-spacing: 1px;
            transition: color var(--transition-theme);
        }

        [data-theme="dark"] .quran-verse-widget .qv-arabic {
            color: #e8d48a;
        }

        .quran-verse-widget .qv-translation {
            font-size: 15px;
            color: var(--charcoal);
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 8px;
            text-align: center; /* Force center alignment */
            transition: color var(--transition-theme);
        }

        [data-theme="dark"] .quran-verse-widget .qv-translation {
            color: #c5c9d0;
        }

        .quran-verse-widget .qv-reference {
            font-size: 13px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center; /* Force center alignment */
        }

        .quran-verse-widget .qv-refresh {
            position: absolute;
            bottom: 14px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(201, 168, 76, 0.4);
            color: var(--gold);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .quran-verse-widget .qv-refresh:hover {
            background: var(--gold-pale);
            border-color: var(--gold);
            transform: rotate(60deg);
        }

        /* ========== PRAYER TRACKER ========== */
        .prayer-tracker-grid {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .prayer-box {
            flex: 1;
            min-width: 60px;
            background: var(--gray-50);
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-sm);
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        [data-theme="dark"] .prayer-box {
            background: var(--input-bg);
            border-color: var(--border-light);
        }
        .prayer-box:hover {
            border-color: var(--green-light);
            transform: translateY(-2px);
        }
        .prayer-box.completed {
            background: var(--green-pale);
            border-color: var(--green);
            color: var(--green-dark);
        }
        [data-theme="dark"] .prayer-box.completed {
            background: var(--green-dark);
            border-color: var(--green);
            color: #fff;
        }
        .prayer-box .prayer-name {
            font-size: 14px;
            font-weight: 700;
        }
        .prayer-box .prayer-time {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .prayer-box.completed .prayer-time {
            color: inherit;
            opacity: 0.8;
        }
        .prayer-box .prayer-check {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--gray-300);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: transparent;
            transition: all var(--transition);
            margin-top: 4px;
        }
        .prayer-box.completed .prayer-check {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        /* ========== DAILY INSPIRATION ========== */
        .name-of-allah {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-medium);
            margin-bottom: 20px;
        }
        .name-of-allah h4 {
            font-family: 'Amiri', 'Traditional Arabic', serif;
            font-size: 36px;
            color: var(--gold);
            font-weight: bold;
            line-height: 1.2;
        }
        .name-of-allah .transliteration {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 8px 0 4px;
            letter-spacing: 0.5px;
        }
        .name-of-allah .meaning {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
        }
        .daily-hadith-box {
            position: relative;
        }
        .daily-hadith-box::before {
            content: '"';
            position: absolute;
            top: -15px;
            left: -10px;
            font-size: 40px;
            color: var(--green-pale);
            font-family: serif;
            z-index: 0;
        }
        [data-theme="dark"] .daily-hadith-box::before {
            color: var(--gray-200);
        }
        .daily-hadith-text {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-primary);
            position: relative;
            z-index: 1;
        }
        .daily-hadith-ref {
            font-size: 12px;
            color: var(--green);
            font-weight: 600;
            margin-top: 12px;
            text-align: right;
            letter-spacing: 0.5px;
        }

        [data-theme="dark"] .quran-verse-widget .qv-refresh:hover {
            background: #2a2418;
        }

        /* ========== DASHBOARD ========== */
        .dash-welcome {
            margin-bottom: 24px;
        }
        .dash-welcome h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
            transition: color var(--transition-theme);
        }
        .dash-welcome h2 span {
            color: var(--green);
        }
        .dash-welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            transition: color var(--transition-theme);
        }

        .dash-progress {
            background: var(--card-bg);
            padding: 18px 24px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--border-light);
            transition: all var(--transition-theme);
        }
        .dash-progress .prog-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .dash-progress .prog-left .emoji-big {
            font-size: 28px;
        }
        .dash-progress .prog-left .prog-text {
            font-size: 14px;
            color: var(--text-secondary);
            transition: color var(--transition-theme);
        }
        .dash-progress .prog-left .prog-text strong {
            color: var(--text-primary);
            transition: color var(--transition-theme);
        }
        .dash-progress .prog-bar {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: var(--gray-200);
            border-radius: 10px;
            overflow: hidden;
        }
        .dash-progress .prog-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), var(--teal));
            border-radius: 10px;
            width: 45%;
            transition: width 1s ease;
        }
        .dash-progress .prog-pct {
            font-weight: 700;
            font-size: 16px;
            color: var(--green);
        }

        .dash-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .dash-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
            transition: all var(--transition-theme);
        }
        .dash-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .dash-card .card-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition-theme);
        }
        .dash-card .card-header a {
            font-size: 13px;
            color: var(--green);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .dash-card .card-header a:hover {
            text-decoration: underline;
        }

        .recommend-item {

            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            color: var(--green);

        }
        .recommend-item .rec-info h4 {

            font-weight: 600;
            color: var(--text-primary);

        }
        .recommend-item .rec-info .rec-actions .btn-save {
            background: var(--gray-100);
            color: var(--text-secondary);
        }
        .recommend-item .rec-info .rec-actions .btn-save:hover {
            background: var(--gray-200);
        }

        .mentor-card {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            transition: border-color var(--transition-theme);
        }
        .mentor-card:last-child {
            border-bottom: none;
        }
        .mentor-card .mentor-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--gold-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--gold);
            flex-shrink: 0;
            border: 2px solid var(--gold-light);
        }
        .mentor-card .mentor-info {
            flex: 1;
            min-width: 120px;
        }
        .mentor-card .mentor-info .name {

            font-size: 15px;
            color: var(--text-primary);

        .mentor-card .mentor-info .name .stars {

        }
        .mentor-card .mentor-info .title {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .mentor-card .mentor-info .msg {
            font-size: 13px;
            color: var(--gray-400);
            margin-top: 2px;
            font-style: italic;
        }
        .mentor-card .mentor-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mentor-card .mentor-actions button {
            padding: 4px 14px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .mentor-card .mentor-actions .btn-msg {
            background: var(--gray-100);
            color: var(--text-primary);
        }
        .mentor-card .mentor-actions .btn-msg:hover {
            background: var(--gray-200);
        }
        .mentor-card .mentor-actions .btn-sched {
            background: var(--green);
            color: #fff;
        }
        .mentor-card .mentor-actions .btn-sched:hover {
            background: var(--green-dark);
        }

        .ai-tip {
            margin-top: 12px;
            padding: 14px 18px;
            background: var(--green-pale);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--green);

            color: var(--text-primary);
            transition: all var(--transition-theme);
        }
        .ai-tip i {
            color: var(--green);
            margin-right: 8px;
        }

        /* ========== MENTOR PAGE ========== */
        .mentor-header {
            margin-bottom: 20px;
        }
        .mentor-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
        }
        .mentor-header p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .mentor-scholar-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--purple-light);
            color: var(--purple);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
            border: 1px solid var(--purple);
        }
        [data-theme="dark"] .mentor-scholar-badge {
            background: #2a1a38;
            border-color: #a569bd;
            color: #a569bd;
        }

        .mentor-community-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--orange-light);
            color: var(--orange);
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
            border: 1px solid var(--orange);
        }
        [data-theme="dark"] .mentor-community-badge {
            background: #2a2418;
            border-color: #d4b55c;
            color: #d4b55c;
        }

        .mentor-section-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            margin: 24px 0 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mentor-section-title i {
            color: var(--gold);
        }

        .mentor-section-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .become-mentor-box {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 24px 28px;
            border: 2px dashed var(--green);
            text-align: center;
            margin: 20px 0;
            transition: all var(--transition-theme);
        }
        .become-mentor-box h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .become-mentor-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .become-mentor-box .btn-primary {
            max-width: 300px;
            margin: 0 auto;
        }
        .become-mentor-box .already-mentor {
            color: var(--green);
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .become-mentor-box .already-mentor i {
            font-size: 20px;
        }

        /* My Mentor Profile Section */
        .my-mentor-profile {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            border: 2px solid var(--green);
            margin-bottom: 24px;
            transition: all var(--transition-theme);
        }
        .my-mentor-profile .profile-header-simple {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .my-mentor-profile .profile-header-simple .avatar-large {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--green-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 28px;
            color: var(--green);
            flex-shrink: 0;
            border: 3px solid var(--gold-light);
        }
        .my-mentor-profile .profile-header-simple .info h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .my-mentor-profile .profile-header-simple .info p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .my-mentor-profile .profile-details {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-light);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .my-mentor-profile .profile-details .detail-item {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .my-mentor-profile .profile-details .detail-item strong {
            color: var(--text-primary);
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        /* ========== MENTOR FILTERS ========== */
        .match-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            border: 1px solid var(--border-light);
            align-items: center;
            transition: all var(--transition-theme);
        }
        .match-filters .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .match-filters .filter-group select {
            padding: 6px 12px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-full);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: var(--input-bg);
            outline: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        .match-filters .filter-group select:focus {
            border-color: var(--green);
        }

        .match-result {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            margin-bottom: 16px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
            transition: all var(--transition-theme);
            flex-wrap: wrap;
            cursor: pointer;
        }
        .match-result:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .match-result .match-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--green-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: var(--green);
            flex-shrink: 0;
            position: relative;
        }
        .match-result .match-avatar .scholar-check {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: var(--purple);
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--card-bg);
        }
        .match-result .match-body {
            flex: 1;
            min-width: 180px;
        }
        .match-result .match-body .mname {
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
            transition: color var(--transition-theme);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .match-result .match-body .mname .stars {
            color: var(--gold);
            font-size: 14px;
            margin-left: 6px;
        }
        .match-result .match-body .mmeta {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 4px 0 6px;
            transition: color var(--transition-theme);
        }
        .match-result .match-body .mmeta .dot {
            color: var(--gray-300);
        }
        .match-result .match-body .mdesc {
            font-size: 14px;
            color: var(--gray-400);
            margin-bottom: 8px;
        }
        .match-result .match-body .mactions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .match-result .match-body .mactions button {
            padding: 6px 18px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .match-result .match-body .mactions .btn-view {
            background: var(--gray-100);
            color: var(--text-primary);
        }
        .match-result .match-body .mactions .btn-view:hover {
            background: var(--gray-200);
        }
        .match-result .match-body .mactions .btn-req {
            background: var(--green);
            color: #fff;
        }
        .match-result .match-body .mactions .btn-req:hover {
            background: var(--green-dark);
        }
        .match-result .match-badge {
            background: var(--green-pale);
            color: var(--green);
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            align-self: center;

        .notify-cta {

            padding: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .notify-cta button {
            padding: 8px 24px;
            border-radius: var(--radius-full);
            border: none;
            background: var(--green);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            margin-top: 6px;
        }
        .notify-cta button:hover {
            background: var(--green-dark);
        }

        /* ===== MENTOR REGISTRATION MODAL ===== */
        .mentor-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeInOverlay 0.3s ease;
        }
        .mentor-modal-overlay.show {
            display: flex;
        }
        .mentor-modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px 36px 28px;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transition: background var(--transition-theme);
        }
        .mentor-modal h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .mentor-modal .modal-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .mentor-modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .mentor-modal .form-group .helper {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .mentor-modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .mentor-modal .modal-actions .btn-primary {
            flex: 1;
        }
        .mentor-modal .modal-actions .btn-secondary {
            flex: 0 0 auto;
            padding: 14px 28px;
            background: var(--gray-100);
            color: var(--text-primary);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .mentor-modal .modal-actions .btn-secondary:hover {
            background: var(--gray-200);
        }

        /* ========== DISCOVER ========== */
        .disco-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 6px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            width: fit-content;
            transition: all var(--transition-theme);
        }
        .disco-tabs .tab {
            padding: 8px 20px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: var(--text-secondary);
        }
        .disco-tabs .tab.active {
            background: var(--green);
            color: #fff;
        }
        .disco-tabs .tab:hover:not(.active) {
            background: var(--gray-100);
        }

        .disco-search {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .disco-search input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
            background: var(--input-bg);
            min-width: 160px;
            color: var(--text-primary);
        }
        .disco-search input:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(26, 107, 79, 0.08);
        }
        .disco-search .filter-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .disco-search .filter-chips .chip {
            padding: 8px 16px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-medium);
            background: var(--card-bg);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            color: var(--text-secondary);
        }
        .disco-search .filter-chips .chip.active {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }
        .disco-search .filter-chips .chip:hover:not(.active) {
            border-color: var(--green);
            color: var(--green);
        }

        .event-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 18px 22px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all var(--transition-theme);
            position: relative;
        }
        .event-card:hover {
            box-shadow: var(--shadow-md);
        }
        .event-card .ev-left {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .event-card .ev-left .ev-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: var(--gold-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--gold);
            flex-shrink: 0;
        }
        .event-card .ev-left .ev-info h4 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition-theme);
        }
        .event-card .ev-left .ev-info .ev-loc {
            font-size: 13px;
            color: var(--text-secondary);
            transition: color var(--transition-theme);
        }
        .event-card .ev-left .ev-info .ev-meta {
            font-size: 13px;
            color: var(--gray-400);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .event-card .ev-left .ev-info .ev-meta .tag {
            background: var(--green-pale);
            color: var(--green);

            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
        }
        .event-card .ev-left .ev-info .ev-significance {

            max-width: 340px;
            z-index: 50;
            font-style: italic;
            line-height: 1.5;

        .event-card:hover .ev-significance {
            display: block;
        }
        .event-card .ev-left .ev-info .ev-significance i {
            margin-right: 6px;
            color: var(--gold);
        }
        .event-card .ev-right {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .event-card .ev-right button {
            padding: 6px 18px;

            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;

        .event-card .ev-right .btn-rsvp {
            background: var(--green);
            color: #fff;

            background: var(--green-dark);

            background: var(--gray-100);
            color: var(--text-secondary);
        }
        .event-card .ev-right .btn-share {
            background: var(--gray-100);
            color: var(--text-secondary);
        }
        .event-card .ev-right .btn-share:hover {
            background: var(--gray-200);
        }

            display: flex;

            border-bottom: 1px solid var(--border-light);

            font-size: 22px;
            color: var(--gold);
            width: 36px;
            text-align: center;
        }
        .mosque-row .mq-info {
            flex: 1;
            min-width: 140px;
        }
        .mosque-row .mq-info h4 {
            font-size: 15px;
